services:
  # The FAMBA API (Node.js/Express)
  - type: web
    name: famba-api
    env: node
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: famba-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

      # IMPORTANT: You will need to add these manually in the Render dashboard
      # after deployment since they are secrets:
      # - STRIPE_SECRET_KEY
      # - CODECHAT_API_KEY
      # - CODECHAT_URL
      # - CODECHAT_WEBHOOK_SECRET

databases:
  # The PostgreSQL Database
  - name: famba-db
    databaseName: famba
    user: famba
