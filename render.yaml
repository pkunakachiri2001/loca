services:
  # The FAMBA API (Node.js/Express)
  - type: web
    name: famba-api
    env: node
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

      # IMPORTANT: Add these secrets in the Render dashboard:
      # - DATABASE_URL (Paste your Neon DB URL here)
      # - STRIPE_SECRET_KEY
      # - CODECHAT_API_KEY
      # - CODECHAT_URL
      # - CODECHAT_WEBHOOK_SECRET
