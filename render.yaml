# Render Blueprint for FleetNest (KUNAKA TECH)
services:
  # Express API Backend Service
  - type: web
    name: fleetnest-api
    env: node
    buildCommand: npm install && npx prisma generate --schema=prisma/schema.prisma && npm run build:api
    startCommand: npm run start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set securely in Render dashboard environment settings
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: STRIPE_MOCK_MODE
        value: "true"

  # Next.js Web Frontend Service
  - type: web
    name: fleetnest-web
    env: node
    buildCommand: npm install && npm run build:web
    startCommand: npm run start:web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_NAME
        value: FleetNest
